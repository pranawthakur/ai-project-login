<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GymCoach Studio — Member Login</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #121317; --bg-soft: #17181d; --fg: #e6e7eb; --muted: #8a8d97; --card: #1b1d23;
  --border: rgba(255,255,255,.08); --primary: #52608f; --primary-2: #2b3244;
  --accent: #6b7797; --danger: #b3595a; --success: #5c9270;
  --shadow-card: 0 1px 2px rgba(0,0,0,.4);
  --shadow-card-inset: inset 0 1px 2px rgba(0,0,0,.35);
  --radius: 10px;
}
* { box-sizing: border-box; }
html, body {
  margin: 0; min-height: 100vh; font-family: 'Inter',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  background: var(--bg); color: var(--fg); overflow-x: hidden; position: relative;
  display: flex; align-items: center; justify-content: center; padding: 24px 16px;
}

@keyframes fadeUp { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }
@keyframes pop { 0%{opacity:0;transform:scale(.92)} 60%{opacity:1;transform:scale(1.03)} 100%{transform:scale(1)} }
@keyframes spin { to{transform:rotate(360deg)} }

.card {
  width: 100%;
  max-width: 420px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 36px 32px;
  box-shadow: var(--shadow-card);
  animation: fadeUp .55s cubic-bezier(.16,1,.3,1) both;
}

.logo {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 8px;
  justify-content: center;
}

.logo-icon {
  width: 40px;
  height: 40px;
  border-radius: 13px;
  background: var(--card);
  color: var(--accent);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 19px;
  border: 1px solid var(--border);
}

.logo-text {
  font-size: 19px;
  font-weight: 800;
  color: var(--fg);
  letter-spacing: -0.3px;
}

.logo-text span { font-family:'Baloo 2',cursive; font-style: italic; font-weight: 600; color: var(--accent); }

.badge {
  display: flex; align-items: center; gap: 6px; width: fit-content; margin: 18px auto 0;
  border: 1px solid var(--border); background: var(--bg); color: var(--accent);
  font-size: 11px; font-weight: 700; padding: 5px 12px; border-radius: 999px;
  box-shadow: var(--shadow-card-inset);
}

/* FORM HEADING */
.form-heading {
  font-family: 'Baloo 2', cursive;
  font-size: 26px;
  font-weight: 800;
  color: var(--fg);
  margin: 18px 0 4px;
  letter-spacing: -0.4px;
  text-align: center;
}

.form-sub {
  font-size: 13px;
  color: var(--muted);
  margin-bottom: 30px;
  text-align: center;
  line-height: 1.5;
}

.field { margin-bottom: 16px; }

.field label {
  display: block;
  font-size: 11px;
  font-weight: 700;
  color: var(--muted);
  letter-spacing: 1px;
  text-transform: uppercase;
  margin-bottom: 8px;
  text-align: center;
}

.code-input {
  width: 100%;
  background: var(--bg);
  border: 1px solid transparent;
  border-radius: 12px;
  padding: 16px 14px;
  font-size: 26px;
  letter-spacing: 10px;
  text-align: center;
  color: var(--fg);
  font-family: 'Inter', sans-serif;
  font-weight: 700;
  outline: none;
  box-shadow: var(--shadow-card-inset);
  transition: border-color 0.2s, box-shadow 0.2s;
}

.code-input::placeholder { color: #2b3350; letter-spacing: 10px; }

.code-input:focus {
  border-color: var(--primary);
  box-shadow: var(--shadow-card-inset);
  border-color: var(--primary);
}

.hint {
  font-size: 11px;
  color: var(--muted);
  margin-top: 8px;
  text-align: center;
}

/* BUTTON */
.btn {
  width: 100%;
  padding: 14px;
  background: var(--primary);
  color: #fff;
  border: none;
  border-radius: 14px;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  font-family: 'Inter', sans-serif;
  margin-top: 6px;
  transition: transform 0.15s, filter 0.2s, box-shadow .2s;
  letter-spacing: 0.2px;
  display: flex; align-items: center; justify-content: center; gap: 8px;
}

.btn:hover { filter: brightness(1.1); transform: translateY(-2px); }
.btn:active { transform: scale(0.98); }

.btn.loading, .btn:disabled {
  opacity: 0.65;
  cursor: not-allowed;
  transform: none;
}

.spin { display: inline-block; width: 13px; height: 13px; border-radius: 50%; border: 2px solid rgba(255,255,255,.35); border-top-color: #fff; animation: spin .8s linear infinite; }

/* HELP TEXT */
.help-text {
  text-align: center;
  font-size: 12px;
  color: var(--muted);
  margin-top: 26px;
  line-height: 1.6;
  padding-top: 20px;
  border-top: 1px solid var(--border);
}

.help-text strong { color: var(--muted); }

/* ERROR */
.error-msg {
  background: rgba(248,113,113,.08);
  border: 1px solid rgba(248,113,113,.3);
  border-radius: 10px;
  padding: 11px 14px;
  font-size: 12.5px;
  color: var(--danger);
  margin-bottom: 16px;
  display: none;
  text-align: center;
  animation: pop .25s cubic-bezier(.16,1,.3,1);
}

.step { display: none; }
.step.active { display: block; }

@media (prefers-color-scheme: light) {
  :root {
    --bg: #f5f1e3; --bg-soft: #ede7d3; --fg: #24262b; --muted: #666a73; --card: #fffdf3;
    --border: rgba(20,20,30,.12); --primary: #46528a; --primary-2: #d7d9e2;
    --accent: #46528a; --danger: #a1403f; --success: #3d7a55;
  }
}
</style>
</head>

<body>

<div class="card">

  <div class="logo">
    <div class="logo-icon">💪</div>
    <div class="logo-text">GymCoach<span>.studio</span></div>
  </div>
  <div class="badge">✨ Member Login</div>

  <!-- ERROR (shared across all steps) -->
  <div class="error-msg" id="errorMsg"></div>

  <!-- STEP 1: enter the 8-digit code -->
  <div class="step active" id="stepCode">
    <div class="form-heading">Welcome back</div>
    <div class="form-sub">Enter the login code your gym gave you to get to your plan</div>

    <div class="field">
      <label for="loginCode">Login code</label>
      <input
        id="loginCode"
        class="code-input"
        type="text"
        inputmode="numeric"
        pattern="[0-9]*"
        maxlength="8"
        placeholder="00000000"
        autocomplete="one-time-code"
      >
    </div>

    <button class="btn" id="continueBtn">Log in</button>

    <div class="help-text">
      <strong>Don't have a code?</strong><br>
      Ask the front desk at your gym — they'll add you as a member and give you an 8-digit code to log in with.
    </div>
  </div>

</div>

<script>
  // Fire-and-forget: wake up the Render backend the instant this page loads,
  // so it's hopefully warm by the time the user logs in.
  const BACKEND_BASE = 'https://ai-project-login.onrender.com';
  fetch(BACKEND_BASE + '/health').catch(() => {
    // Silently ignore errors — this is just a best-effort warm-up ping.
  });
</script>
<script>
  // ── Multi-gym skeleton ──────────────────────────────────────────────────
  // A gym-specific access link (generated by the dev-console / gym-admin
  // dashboard, both separate repos) lands here as /member/login?gym=<slug>
  // — or, if you're on Vercel's rewrite, the raw URL is whatever
  // vercel.json maps /member/login to. Either way, capture the slug once
  // and remember it in localStorage so dashbord.html / the /result flow
  // can send it back as an X-Gym-Slug header on every API call. No slug
  // present -> falls back to the single demo gym on the backend.
  const gymSlugParam = new URLSearchParams(window.location.search).get('gym');
  if (gymSlugParam) {
    localStorage.setItem('gymSlug', gymSlugParam);
  }

  // ── Elements ──────────────────────────────────────────────────────────
  const errorMsg = document.getElementById('errorMsg');

  const codeInput = document.getElementById('loginCode');
  const continueBtn = document.getElementById('continueBtn');

  function showError(msg) {
    errorMsg.textContent = msg;
    errorMsg.style.display = 'block';
  }

  function hideError() {
    errorMsg.style.display = 'none';
    errorMsg.textContent = '';
  }

  function setLoading(btn, isLoading, loadingText, normalText) {
    btn.disabled = isLoading;
    btn.classList.toggle('loading', isLoading);
    btn.innerHTML = isLoading ? `<span class="spin"></span>${loadingText}` : normalText;
  }

  function gymHeaders() {
    const slug = localStorage.getItem('gymSlug');
    return slug ? { 'X-Gym-Slug': slug } : {};
  }

  function extractErrorDetail(data, fallback) {
    // The backend's 400 for "no password yet" sends detail as an object
    // ({message, needs_password_setup}), everything else sends a plain
    // string — handle both so a stray shape never bubbles up as
    // "[object Object]" in the UI.
    if (!data || !data.detail) return fallback;
    if (typeof data.detail === 'string') return data.detail;
    if (typeof data.detail === 'object' && data.detail.message) return data.detail.message;
    return fallback;
  }

  // Digits only, as-you-type — the code the gym gives out is 8 digits.
  codeInput.addEventListener('input', () => {
    codeInput.value = codeInput.value.replace(/\D/g, '').slice(0, 8);
  });

  function completeLogin(data) {
    // The member's identity going forward: our own session token (not a
    // Supabase Auth session — members never get one of those anymore).
    // Stored in localStorage (not sessionStorage) so it survives a closed
    // tab/browser restart — that's the "remember session" behavior; the
    // token itself is long-lived (see promptgen-backend/app/auth.py).
    localStorage.setItem('memberToken', data.token);
    localStorage.setItem('memberName', (data.member && data.member.name) || '');
    window.location.href = 'dashbord.html';
  }

  // ── Log in with the code alone ──────────────────────────────────────────
  async function doLogin() {
    hideError();
    const code = codeInput.value.trim();
    if (!code || code.length < 8) { showError('Enter your 8-digit login code'); return; }

    setLoading(continueBtn, true, 'Logging in…', 'Log in');

    try {
      const res = await fetch(BACKEND_BASE + '/member/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', ...gymHeaders() },
        body: JSON.stringify({ code, gym: localStorage.getItem('gymSlug') || null }),
      });
      const data = await res.json().catch(() => ({}));

      if (!res.ok) {
        showError(extractErrorDetail(data, 'Could not verify that code. Check it and try again.'));
        return;
      }

      completeLogin(data);
    } catch (e) {
      showError('Network error — please try again.');
    } finally {
      setLoading(continueBtn, false, 'Logging in…', 'Log in');
    }
  }

  continueBtn.addEventListener('click', doLogin);
  codeInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') doLogin(); });
</script>
</body>
</html>
